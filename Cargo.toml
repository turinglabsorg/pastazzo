[workspace]
resolver = "3"
members = ["crates/pastazzo", "crates/pastazzo-core"]
default-members = ["crates/pastazzo"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/turinglabsorg/pastazzo"

# Argon2id at the protocol's parameters is unbearably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

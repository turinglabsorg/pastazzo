[package]
name = "pastazzo-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pastazzo sync client: end-to-end encrypted clipboard sync with a pastazzo server"

[dependencies]
pastazzo-core = { path = "../pastazzo-core" }
base64 = "0.22"
rand = "0.8"
keyring = "4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
zeroize = "1.8"

[dev-dependencies]
axum = "0.8"
pastazzo-server = { path = "../pastazzo-server" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pastazzo Harness</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="desktop">
      <button class="open-button" data-testid="open">Open Pastazzo</button>
      <textarea class="target" data-testid="target" spellcheck="false">Focused app target</textarea>
    </main>

    <section class="pastebar-overlay" data-testid="overlay" aria-hidden="true">
      <div class="pastebar-panel" role="dialog" aria-label="Clipboard history">
        <div class="pastebar-content">
          <div class="pastebar-main">
            <input class="pastebar-search" data-testid="search" placeholder="Search clipboard" autocomplete="off">
            <div class="pastebar-scroll" data-testid="shelf-scroll">
              <div class="pastebar-list" data-testid="shelf"></div>
            </div>
          </div>
          <aside class="pastebar-taskbar" data-testid="taskbar">
            <button class="pastebar-tool-button pastebar-clear-button" data-testid="clear-history" type="button">
              <span class="pastebar-tool-icon" aria-hidden="true"></span>
            </button>
          </aside>
        </div>
      </div>
    </section>

    <script src="./app.js"></script>
  </body>
</html>

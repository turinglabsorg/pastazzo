<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pastazzo Settings Preview</title>
    <link rel="stylesheet" href="./settings.css">
  </head>
  <body>
    <main class="settings-shell">
      <section class="settings-window" aria-label="Pastazzo settings">
        <header class="settings-header">
          <h1>Pastazzo Settings</h1>
        </header>
        <section class="settings-group">
          <h2>Keyboard</h2>
          <div class="settings-row" data-testid="shortcut-row">
            <div>
              <div class="settings-title">Open Pastazzo</div>
              <div class="settings-subtitle">Click the shortcut and press a new key combination.</div>
            </div>
            <div class="settings-actions">
              <button class="shortcut-button" data-testid="shortcut-button">Shift+Alt+V</button>
              <button class="reset-button" data-testid="reset-button" aria-label="Reset shortcut"></button>
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>

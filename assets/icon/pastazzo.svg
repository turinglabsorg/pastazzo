<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC15E"/>
      <stop offset="1" stop-color="#F2661B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF4E6"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6272"/>
      <stop offset="1" stop-color="#2F3540"/>
    </linearGradient>
    <linearGradient id="rind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA53A"/>
      <stop offset="1" stop-color="#F06C12"/>
    </linearGradient>
    <radialGradient id="flesh" cx="512" cy="596" r="130" gradientUnits="userSpaceOnUse">
